# SPDX-License-Identifier: GPL-2.0-only
name: Release

run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/v')
      && format('Release {0}', github.ref_name)
      || format('Release candidate {0}', github.sha) }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version, got: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake binutils build-essential cmake curl libbz2-dev \
            libcurl4-openssl-dev libicu-dev liblzma-dev libtool ninja-build \
            pkg-config zlib1g-dev
      - name: Build release archive
        run: ./scripts/build-release.sh "${{ matrix.architecture }}" "${{ steps.release.outputs.version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: getbiblesword-${{ steps.release.outputs.version }}-linux-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Resolve publication
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version, got: $version" >&2
            exit 1
          fi

          tag="v$version"
          should_publish=true
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
              exit 1
            fi
          elif gh release view "$tag" >/dev/null 2>&1; then
            should_publish=false
            echo "::notice::Release $tag already exists; this run remains a candidate."
          elif git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag already points to $tag_commit, not $GITHUB_SHA." >&2
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate "$tag" "$GITHUB_SHA" --message "getbiblesword $version"
            git push origin "refs/tags/$tag"
          fi

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'should_publish=%s\n' "$should_publish" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.publication.outputs.should_publish == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Add corresponding SWORD source
        if: steps.publication.outputs.should_publish == 'true'
        run: |
          ./scripts/fetch-sword.sh dist/sword-1.9.0.tar.gz
          cd dist
          sha256sum sword-1.9.0.tar.gz > sword-1.9.0.tar.gz.sha256
      - name: Verify checksums
        if: steps.publication.outputs.should_publish == 'true'
        run: |
          cd dist
          sha256sum --check ./*.sha256
      - name: Generate release notes
        if: steps.publication.outputs.should_publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.publication.outputs.tag }}
          RELEASE_VERSION: ${{ steps.publication.outputs.version }}
        run: |
          previous_tag="$(
            git describe \
              --tags \
              --abbrev=0 \
              --match 'v[0-9]*.[0-9]*.[0-9]*' \
              "${RELEASE_TAG}^" 2>/dev/null || true
          )"
          range="$RELEASE_TAG"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$RELEASE_TAG"
          fi

          mkdir -p build
          {
            printf '# getbiblesword %s\n\n' "$RELEASE_VERSION"
            if [[ -n "$previous_tag" ]]; then
              printf 'Changes since `%s`.\n\n' "$previous_tag"
            else
              printf 'Initial engineering preview.\n\n'
            fi
            printf '## Commits\n\n'
            git log \
              --reverse \
              --format='- [`%h`](https://github.com/getbible/getbiblesword/commit/%H) %s' \
              "$range" \
              --
          } > build/release-notes.md
      - name: Publish GitHub release
        if: steps.publication.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publication.outputs.tag }}
          RELEASE_VERSION: ${{ steps.publication.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit \
              "$RELEASE_TAG" \
              --title "getbiblesword $RELEASE_VERSION" \
              --notes-file build/release-notes.md \
              --verify-tag
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create \
              "$RELEASE_TAG" \
              dist/* \
              --title "getbiblesword $RELEASE_VERSION" \
              --notes-file build/release-notes.md \
              --verify-tag
          fi
