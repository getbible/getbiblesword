# SPDX-License-Identifier: GPL-2.0-only
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake binutils build-essential cmake curl libbz2-dev \
            libcurl4-openssl-dev libicu-dev liblzma-dev libtool ninja-build \
            pkg-config zlib1g-dev
      - name: Build pinned CrossWire SWORD
        run: ./scripts/build-sword.sh "$PWD/build/dependencies/sword"
      - uses: github/codeql-action/init@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
        with:
          languages: c-cpp
      - name: Build getBibleSword
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/dependencies/sword/lib/pkgconfig
        run: |
          cmake --preset dev
          cmake --build --preset dev --parallel
      - uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3
