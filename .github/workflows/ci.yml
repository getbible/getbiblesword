# SPDX-License-Identifier: GPL-2.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake binutils build-essential clang cmake curl jq libbz2-dev \
            libcurl4-openssl-dev libicu-dev liblzma-dev libtool ninja-build \
            pkg-config zlib1g-dev
      - name: Build pinned CrossWire SWORD
        run: ./scripts/build-sword.sh "$PWD/build/dependencies/sword"
      - name: Configure
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/dependencies/sword/lib/pkgconfig
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev --parallel
      - name: Test
        run: ctest --preset dev
      - name: Verify installed C consumers
        run: |
          DESTDIR="$PWD/build/stage-${{ matrix.compiler }}" \
            cmake --install build/dev
          ./tests/installed_consumer.sh "$PWD/build/stage-${{ matrix.compiler }}"
      - name: Verify deterministic empty-root listing
        run: |
          mkdir -p build/empty-sword/mods.d
          build/dev/getbiblesword list --sword-path build/empty-sword > build/first.ndjson
          build/dev/getbiblesword list --sword-path build/empty-sword > build/second.ndjson
          cmp build/first.ndjson build/second.ndjson
      - name: Repository checks
        run: ./scripts/check.sh

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake binutils build-essential cmake curl libbz2-dev \
            libcurl4-openssl-dev libicu-dev liblzma-dev libtool ninja-build \
            pkg-config zlib1g-dev
      - name: Build pinned CrossWire SWORD
        run: ./scripts/build-sword.sh "$PWD/build/dependencies/sword"
      - name: Configure and test with sanitizers
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/dependencies/sword/lib/pkgconfig
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake --preset sanitizers
          cmake --build --preset sanitizers --parallel
          ctest --preset sanitizers

  system-provider:
    name: System SWORD provider
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install system SWORD development package
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binutils build-essential cmake libsword-dev ninja-build pkg-config
      - name: Configure system-provider build
        run: |
          cmake \
            -S . \
            -B build/system \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGETBIBLESWORD_SWORD_PROVIDER=SYSTEM
      - name: Build
        run: cmake --build build/system --parallel
      - name: Test
        run: ctest --test-dir build/system --output-on-failure

  conformance:
    name: CrossWire driver conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake binutils build-essential cmake curl libbz2-dev \
            libcurl4-openssl-dev libicu-dev liblzma-dev libtool ninja-build \
            pkg-config zlib1g-dev
      - name: Build pinned CrossWire SWORD
        run: ./scripts/build-sword.sh "$PWD/build/dependencies/sword"
      - name: Configure conformance suite
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/dependencies/sword/lib/pkgconfig
        run: |
          cmake \
            -S . \
            -B build/conformance \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGETBIBLESWORD_ENABLE_CONFORMANCE_TESTS=ON
      - name: Build
        run: cmake --build build/conformance --parallel
      - name: Run every driver and artifact round trip
        run: ctest --test-dir build/conformance --output-on-failure
